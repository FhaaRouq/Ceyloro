name: Release desktop packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build LGPL FFmpeg universal
        run: ./scripts/build-ffmpeg-universal.sh
      - name: Build universal macOS app
        run: ./scripts/build-app.sh
      - name: Verify FFmpeg is bundled
        run: test -x Ceyloro.app/Contents/Resources/ffmpeg && ./scripts/verify-ffmpeg.sh Ceyloro.app/Contents/Resources/ffmpeg
      - name: Package macOS app
        run: ditto -c -k --keepParent Ceyloro.app Ceyloro-macOS-universal.zip
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Ceyloro-macOS-universal
          path: Ceyloro-macOS-universal.zip

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify LGPL FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg-windows.ps1 -Destination ffmpeg-package
      - name: Publish self-contained Windows app
        run: dotnet publish Windows/Ceyloro.Windows/Ceyloro.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Ceyloro | Out-Null
          Copy-Item publish/* package/Ceyloro/ -Recurse -Force
          Copy-Item ffmpeg-package/ffmpeg.exe package/Ceyloro/ffmpeg.exe -Force
          Copy-Item ffmpeg-package/FFmpeg-LICENSE.txt package/Ceyloro/FFmpeg-LICENSE.txt -Force
          Copy-Item Windows/README.md package/Ceyloro/README.md -Force
          Compress-Archive -Path package/Ceyloro -DestinationPath Ceyloro-Windows-x64.zip -Force
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Ceyloro-Windows-x64
          path: Ceyloro-Windows-x64.zip

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: Ceyloro-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=("$GITHUB_REF_NAME" "dist/Ceyloro-macOS-universal.zip" "dist/Ceyloro-Windows-x64.zip" "--repo" "$GITHUB_REPOSITORY" "--title" "Ceyloro $GITHUB_REF_NAME" "--generate-notes")
          case "$GITHUB_REF_NAME" in
            *-*) release_args+=("--prerelease") ;;
          esac
          gh release create "${release_args[@]}"
