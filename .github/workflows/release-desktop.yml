name: Release desktop packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: swift test
      - name: Build LGPL FFmpeg universal
        run: ./scripts/build-ffmpeg-universal.sh
      - name: Build universal macOS app
        run: ./scripts/build-app.sh
      - name: Verify FFmpeg is bundled
        run: test -x Ceyloro.app/Contents/Resources/ffmpeg && ./scripts/verify-ffmpeg.sh Ceyloro.app/Contents/Resources/ffmpeg
      - name: Package macOS app
        run: ditto -c -k --keepParent Ceyloro.app Ceyloro-macOS-universal.zip
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Ceyloro-macOS-universal
          path: Ceyloro-macOS-universal.zip

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify LGPL FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg-windows.ps1 -Destination ffmpeg-package -Architecture ${{ matrix.architecture }}
      - name: Publish self-contained Windows app
        run: dotnet publish Windows/Ceyloro.Windows/Ceyloro.Windows.csproj --configuration Release --runtime win-${{ matrix.architecture }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Ceyloro | Out-Null
          Copy-Item publish/* package/Ceyloro/ -Recurse -Force
          Copy-Item ffmpeg-package/ffmpeg.exe package/Ceyloro/ffmpeg.exe -Force
          Copy-Item ffmpeg-package/ffprobe.exe package/Ceyloro/ffprobe.exe -Force
          Copy-Item ffmpeg-package/FFmpeg-LICENSE.txt package/Ceyloro/FFmpeg-LICENSE.txt -Force
          if (Test-Path document-engines) {
            Copy-Item document-engines package/Ceyloro/DocumentEngines -Recurse -Force
          }
          Copy-Item Windows/README.md package/Ceyloro/README.md -Force
          Compress-Archive -Path package/Ceyloro -DestinationPath Ceyloro-Windows-${{ matrix.architecture }}.zip -Force
      - name: Create Windows package checksum
        shell: pwsh
        run: |
          $package = "Ceyloro-Windows-${{ matrix.architecture }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          "$hash  $package" | Set-Content -Encoding ascii "$package.sha256"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Ceyloro-Windows-${{ matrix.architecture }}
          path: |
            Ceyloro-Windows-${{ matrix.architecture }}.zip
            Ceyloro-Windows-${{ matrix.architecture }}.zip.sha256

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: Ceyloro-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=("$GITHUB_REF_NAME" "dist/Ceyloro-macOS-universal.zip" "dist/Ceyloro-Windows-x64.zip" "dist/Ceyloro-Windows-x64.zip.sha256" "dist/Ceyloro-Windows-arm64.zip" "dist/Ceyloro-Windows-arm64.zip.sha256" "--repo" "$GITHUB_REPOSITORY" "--title" "Ceyloro $GITHUB_REF_NAME" "--generate-notes" "--latest")
          case "$GITHUB_REF_NAME" in
            *-preview*|*-alpha*|*-beta*|*-rc*) release_args+=("--prerelease") ;;
          esac
          gh release create "${release_args[@]}"
