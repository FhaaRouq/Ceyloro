name: Release desktop packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    # macos-14 dihentikan 2 November 2026 — migrasi ke macos-15 (audit temuan P1-04).
    # Xcode default pada macos-15: Xcode 16.x, SDK macOS 15.
    # Deployment target tetap macOS 13 (didefinisikan di Package.swift platforms: [.macOS(.v13)]).
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: swift test
      - name: Build LGPL FFmpeg universal
        run: ./scripts/build-ffmpeg-universal.sh
      - name: Build universal macOS app
        env:
          CEYLORO_VERSION: ${{ github.ref_name }}
          CEYLORO_BUILD: ${{ github.run_number }}
        run: |
          # CATATAN: engine dokumen (LibreOffice + Pandoc) TIDAK dibundel secara default di CI
          # karena tidak tersedia di image runner macos-15. Build tetap menghasilkan .app yang
          # berfungsi — fitur konversi dokumen hanya tersembunyi dari UI, bukan error.
          #
          # Untuk mengaktifkan bundling engine dokumen pada release tertentu:
          # 1. Tambahkan langkah sebelum ini yang mengunduh dan menyiapkan engine ke sebuah
          #    direktori, misalnya ./document-engines-staging/
          # 2. Set env: CEYLORO_DOCUMENT_ENGINES_PATH=./document-engines-staging/
          #             CEYLORO_STAGE_DOCUMENT_ENGINES=1
          # 3. Pastikan SOURCE_ROOT dan DESTINATION berbeda (lihat stage-document-engines.sh)
          #
          # Jangan set CEYLORO_STAGE_DOCUMENT_ENGINES=1 tanpa langkah persiapan di atas —
          # build akan exit dengan error karena LibreOffice dan Pandoc tidak ditemukan.
          version="${CEYLORO_VERSION#v}"
          CEYLORO_VERSION="$version" CEYLORO_BUILD="$CEYLORO_BUILD" ./scripts/build-app.sh
      - name: Verify FFmpeg is bundled
        run: test -x Ceyloro.app/Contents/Resources/ffmpeg && ./scripts/verify-ffmpeg.sh Ceyloro.app/Contents/Resources/ffmpeg
      - name: Package macOS app
        run: ditto --norsrc -c -k --keepParent Ceyloro.app Ceyloro-macOS-universal.zip
      - name: Create macOS package checksum
        run: shasum -a 256 Ceyloro-macOS-universal.zip | awk '{print $1"  "$2}' > Ceyloro-macOS-universal.zip.sha256
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Ceyloro-macOS-universal
          path: |
            Ceyloro-macOS-universal.zip
            Ceyloro-macOS-universal.zip.sha256

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify LGPL FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg-windows.ps1 -Destination ffmpeg-package -Architecture ${{ matrix.architecture }}
      - name: Publish self-contained Windows app
        run: dotnet publish Windows/Ceyloro.Windows/Ceyloro.Windows.csproj --configuration Release --runtime win-${{ matrix.architecture }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Ceyloro | Out-Null
          Copy-Item publish/* package/Ceyloro/ -Recurse -Force
          Copy-Item ffmpeg-package/ffmpeg.exe package/Ceyloro/ffmpeg.exe -Force
          Copy-Item ffmpeg-package/ffprobe.exe package/Ceyloro/ffprobe.exe -Force
          Copy-Item ffmpeg-package/FFmpeg-LICENSE.txt package/Ceyloro/FFmpeg-LICENSE.txt -Force
          if (Test-Path document-engines) {
            Copy-Item document-engines package/Ceyloro/DocumentEngines -Recurse -Force
          }
          Copy-Item Windows/README.md package/Ceyloro/README.md -Force
          Compress-Archive -Path package/Ceyloro -DestinationPath Ceyloro-Windows-${{ matrix.architecture }}.zip -Force
      - name: Create Windows package checksum
        shell: pwsh
        run: |
          $package = "Ceyloro-Windows-${{ matrix.architecture }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $package).Hash.ToLowerInvariant()
          "$hash  $package" | Set-Content -Encoding ascii "$package.sha256"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Ceyloro-Windows-${{ matrix.architecture }}
          path: |
            Ceyloro-Windows-${{ matrix.architecture }}.zip
            Ceyloro-Windows-${{ matrix.architecture }}.zip.sha256

  release:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: Ceyloro-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=("$GITHUB_REF_NAME" "dist/Ceyloro-macOS-universal.zip" "dist/Ceyloro-macOS-universal.zip.sha256" "dist/Ceyloro-Windows-x64.zip" "dist/Ceyloro-Windows-x64.zip.sha256" "dist/Ceyloro-Windows-arm64.zip" "dist/Ceyloro-Windows-arm64.zip.sha256" "--repo" "$GITHUB_REPOSITORY" "--title" "Ceyloro $GITHUB_REF_NAME" "--generate-notes" "--latest")
          case "$GITHUB_REF_NAME" in
            *-preview*|*-alpha*|*-beta*|*-rc*) release_args+=("--prerelease") ;;
          esac
          gh release create "${release_args[@]}"
