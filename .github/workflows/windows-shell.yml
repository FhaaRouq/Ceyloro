name: Windows shell

on:
  push:
    paths:
      - "Windows/**"
      - ".github/workflows/windows-shell.yml"
  pull_request:
    paths:
      - "Windows/**"
      - ".github/workflows/windows-shell.yml"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build Ceyloro Windows shell for ${{ matrix.architecture }}
        run: dotnet build Windows/Ceyloro.Windows/Ceyloro.Windows.csproj --configuration Release -r win-${{ matrix.architecture }} --no-self-contained
      - name: Run Windows conversion checks
        if: matrix.architecture == 'x64'
        run: dotnet run --project Windows/Ceyloro.Windows.Tests/Ceyloro.Windows.Tests.csproj --configuration Release -r win-x64

