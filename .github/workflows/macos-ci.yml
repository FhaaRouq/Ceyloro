name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # macos-14 dihentikan 2 November 2026 — migrasi ke macos-15 (audit temuan P1-04).
    # Xcode default pada macos-15: Xcode 16.x, SDK macOS 15.
    # Deployment target tetap macOS 13 (didefinisikan di Package.swift).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: swift test
      - name: Build release binaries
        run: swift build -c release
